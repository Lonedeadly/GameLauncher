# Проверочная сборка для pull request. На push в main она не нужна:
# release.yml собирает тот же exe тем же способом и ещё публикует его,
# а собирать одно и то же дважды — пять минут раннера на каждый коммит.

name: build

on:
  pull_request:
  workflow_dispatch:

# Сборке хватает чтения. Права по умолчанию зависят от настроек репозитория
# и могут оказаться шире нужного — задаём явно.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish src/GameLauncher -c Release -o publish

      - name: Report size
        shell: pwsh
        run: |
          $f = Get-Item publish/GameLauncher.exe
          "GameLauncher.exe = {0:N1} MB" -f ($f.Length / 1MB)

      - name: Validate catalog.json
        shell: pwsh
        run: |
          Get-Content catalog.json -Raw -Encoding utf8 | ConvertFrom-Json | Out-Null
          "catalog.json parses"
