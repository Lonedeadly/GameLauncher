name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # GITHUB_TOKEN встроенный, отдельных секретов не нужно

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Версия берётся из тега, а не хранится в репозитории: иначе она
      # рано или поздно разойдётся с тем, что написано на релизе.
      - name: Publish
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          "Версия сборки: $version"
          dotnet publish src/GameLauncher -c Release -o publish -p:Version=$version

      # Имя ассета стабильное, без версии: так самообновление лаунчера
      # сможет искать его так же, как игры ищут свой zip.
      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            publish/GameLauncher.exe `
            --title "$env:GITHUB_REF_NAME" `
            --generate-notes
